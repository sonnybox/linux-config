set-option -g prefix C-Space
set-option -g allow-rename off

set -s set-clipboard on
set -g allow-passthrough on

set -g status-position bottom
# set -g mouse on
set -g status-right "#[fg=white,bg=default]#[fg=black,bg=white] %B %d 󰧞  %I:%M %p "
set -g status-left "#[fg=black,bg=white]  #[bold]#S#[fg=white,bg=default]#[bg=default] "
set -g base-index 1
set -g status-style 'bg=#000000'

setw -g pane-base-index 1
setw -g window-status-format '#[fg=gray,bg=default]#[fg=black,bg=gray]#I|#W#[fg=gray,bg=#000000]'
setw -g window-status-current-style 'fg=black bg=blue'

set-window-option -g window-status-current-format '#[fg=blue,bg=#000000]#[fg=black,bg=blue]#W#F#[fg=blue,bg=#000000]'

unbind %
unbind &

bind x kill-window
bind r source-file ~/.config/tmux/tmux.conf
bind "'" split-window -h
